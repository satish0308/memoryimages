services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: memorypics-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:////data/db/memorypics.db}
      - POSTGRES_URL=${POSTGRES_URL:-postgresql://memorypics:memorypics_password_123@db:5432/memorypics}
      - MEDIA_DIR=/data/originals
      - THUMBNAIL_DIR=/data/thumbnails
      - SECRET_KEY=${SECRET_KEY:-memorypics_secret_dev_key_12345}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/sync/google/callback}
      - OAUTHLIB_RELAX_TOKEN_SCOPE=1
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://host.docker.internal:9002}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin123}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-mymemorypics}
      - S3_REGION_NAME=${S3_REGION_NAME:-us-east-1}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://localhost:9002}
      - S3_CONSOLE_URL=${S3_CONSOLE_URL:-http://localhost:9001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/app:/app/app
      - ./data/db:/data/db
      - ./data/originals:/data/originals
      - ./data/thumbnails:/data/thumbnails
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  db:
    image: pgvector/pgvector:pg16
    container_name: memorypics-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-memorypics}
      - POSTGRES_USER=${POSTGRES_USER:-memorypics}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-memorypics_password_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-memorypics} -d $${POSTGRES_DB:-memorypics}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: memorypics-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  db_data:
  postgres_data:
  originals_data:
  thumbnails_data:
