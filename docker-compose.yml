services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: memorypics-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://memorypics:memorypics_password_123@db:5432/memorypics}
      - POSTGRES_URL=${POSTGRES_URL:-postgresql://memorypics:memorypics_password_123@db:5432/memorypics}
      - MEDIA_DIR=/data/originals
      - THUMBNAIL_DIR=/data/thumbnails
      - SECRET_KEY=${SECRET_KEY:-memorypics_secret_dev_key_12345}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://192.168.0.103:3000}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/sync/google/callback}
      - OAUTHLIB_RELAX_TOKEN_SCOPE=1
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin123}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-mymemorypics}
      - S3_REGION_NAME=${S3_REGION_NAME:-us-east-1}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://localhost:${MINIO_PORT:-9000}}
      - S3_CONSOLE_URL=${S3_CONSOLE_URL:-http://localhost:${MINIO_CONSOLE_PORT:-9001}}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./backend/app:/app/app
      - ./data/db:/data/db
      - ./.env:/app/.env
      - ./data/originals:/data/originals
      - /media/satish/Data2/all_extracts:/data/originals/all_extracts:ro
      - ./data/thumbnails:/data/thumbnails
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      db:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: memorypics-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 2s

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: memorypics-worker
    command: python -m app.worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://memorypics:memorypics_password_123@db:5432/memorypics}
      - POSTGRES_URL=${POSTGRES_URL:-postgresql://memorypics:memorypics_password_123@db:5432/memorypics}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - MEDIA_DIR=/data/originals
      - THUMBNAIL_DIR=/data/thumbnails
      - SECRET_KEY=${SECRET_KEY:-memorypics_secret_dev_key_12345}
      - S3_ENDPOINT_URL=${S3_ENDPOINT_URL:-http://minio:9000}
      - S3_ACCESS_KEY_ID=${S3_ACCESS_KEY_ID:-minioadmin}
      - S3_SECRET_ACCESS_KEY=${S3_SECRET_ACCESS_KEY:-minioadmin123}
      - S3_BUCKET_NAME=${S3_BUCKET_NAME:-mymemorypics}
      - S3_REGION_NAME=${S3_REGION_NAME:-us-east-1}
      - S3_PUBLIC_URL=${S3_PUBLIC_URL:-http://localhost:${MINIO_PORT:-9000}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - ./backend/app:/app/app
      - ./data/db:/data/db
      - ./.env:/app/.env
      - ./data/originals:/data/originals
      - /media/satish/Data2/all_extracts:/data/originals/all_extracts:ro
      - ./data/thumbnails:/data/thumbnails
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      db:
        condition: service_healthy

  minio:
    image: quay.io/minio/aistor/minio:latest
    container_name: memorypics-minio
    restart: unless-stopped
    command: server /data --console-address ":9001" --license /minio.license
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      - MINIO_ROOT_USER=${S3_ACCESS_KEY_ID:-minioadmin}
      - MINIO_ROOT_PASSWORD=${S3_SECRET_ACCESS_KEY:-minioadmin123}
    volumes:
      - minio_data:/data
      - ./minio.license:/minio.license:ro

  db:
    image: pgvector/pgvector:pg16
    container_name: memorypics-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-memorypics}
      - POSTGRES_USER=${POSTGRES_USER:-memorypics}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-memorypics_password_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-memorypics} -d $${POSTGRES_DB:-memorypics}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: memorypics-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: memorypics-caddy
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

  prometheus:
    image: prom/prometheus:latest
    container_name: memorypics-prometheus
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.listen-address=0.0.0.0:9090"
    depends_on:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: memorypics-grafana
    restart: unless-stopped
    network_mode: host
    environment:
      - GF_SERVER_HTTP_PORT=3001
      - GF_SECURITY_ALLOW_EMBEDDING=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  db_data:
  postgres_data:
  originals_data:
  thumbnails_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:
